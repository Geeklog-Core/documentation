name: Publish fork documentation preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fork-pages-preview
  cancel-in-progress: true
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/dual-output-222
      - uses: actions/checkout@v4
        with:
          repository: Geeklog-Core/geeklog
          ref: dd44c01368afad32e16467fd5357af3299c11d3a
          path: core-source
          sparse-checkout: |
            public_html/docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_install_anchors.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - run: python tools/build_dual_preview.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/online
      - id: deployment
        uses: actions/deploy-pages@v4
