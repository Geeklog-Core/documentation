name: Publish Geeklog documentation (maintainer opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Geeklog-Core/geeklog
          ref: dd44c01368afad32e16467fd5357af3299c11d3a
          path: core-source
          sparse-checkout: |
            public_html/docs
      - uses: actions/checkout@v4
        with:
          repository: Geeklog-Core/geeklog
          ref: v2.2.2
          path: release-source
          sparse-checkout: |
            public_html/docs
      - uses: actions/checkout@v4
        with:
          repository: Geeklog-Core/geeklog
          ref: v2.2.2
          path: release-plugin-source
          sparse-checkout: |
            public_html/admin/plugins/recaptcha/docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_release_provenance.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
          GEEKLOG_RELEASE_DOCS: release-source/public_html/docs
      - run: python tools/check_install_anchors.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - run: python tools/check_install_bundle.py
      - run: python tools/check_install_legacy.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - run: python tools/check_install_overlay.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - run: python tools/build_dual_preview.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
          GEEKLOG_RELEASE_RECAPTCHA_DOCS: release-plugin-source/public_html/admin/plugins/recaptcha/docs
      - run: python tools/build_site_search.py
      - run: python tools/check_dual_archive.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
          GEEKLOG_RELEASE_RECAPTCHA_DOCS: release-plugin-source/public_html/admin/plugins/recaptcha/docs
      - run: python tools/check_configuration_coverage.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
      - run: python tools/check_delivery_readiness.py
      - run: python tools/check_extracted_overlay.py
        env:
          GEEKLOG_CORE_DOCS: core-source/public_html/docs
          GEEKLOG_RELEASE_RECAPTCHA_DOCS: release-plugin-source/public_html/admin/plugins/recaptcha/docs
      - run: python tools/check_http_preview.py
      - run: python -m py_compile tools/test_chromebook_overlay.py
      - uses: actions/upload-artifact@v4
        with:
          name: geeklog-2.2.2-embedded-docs-preview
          path: dist/geeklog-2.2.2-docs-preview.zip
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/online
      - id: deployment
        uses: actions/deploy-pages@v4
